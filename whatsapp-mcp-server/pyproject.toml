[project]
name = "whatsapp-mcp-server"
version = "0.1.0"
description = "WhatsApp MCP server with scoped, allowlisted chat access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
